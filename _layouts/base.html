<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {%- seo -%}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    {%- feed_meta -%}

    {%- if site.mathjax -%}
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    {%- endif -%}
  </head>

  <body class="paper-shell{% if page.body_class %} {{ page.body_class }}{% endif %}">
    <div class="paper-vignette" aria-hidden="true"></div>
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="site-container">
      {%- include header.html -%}

      <div class="marginalia" aria-hidden="true">Reliable ML / Statistical Software</div>

      <main class="main-content{% if page.layout == 'post' or page.layout == 'page' %} narrow{% endif %}{% if page.main_class %} {{ page.main_class }}{% endif %}" role="main">
        {{ content }}
      </main>

      {%- include footer.html -%}
    </div>
  </body>
</html>
