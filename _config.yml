# Homepage Projects
featured_projects:
  - name: nonconform
    description: Conformal anomaly detection and change-point detection for turning anomaly scores into calibrated p-values, with split, cross, and weighted conformal workflows plus FDR-controlled decisions.
    stack: Python, conformal inference, anomaly detection, FDR control
    links:
      - label: GitHub
        url: https://github.com/OliverHennhoefer/nonconform
      - label: Docs
        url: https://oliverhennhoefer.github.io/nonconform/
      - label: PyPI
        url: https://pypi.org/project/nonconform/
  - name: online-fdr
    description: Sequential multiple-testing procedures for online FDR and FWER control, including one-by-one APIs for LORD, SAFFRON, ADDIS, alpha-spending, and batch baselines.
    stack: Python, online FDR, FWER, sequential testing
    links:
      - label: GitHub
        url: https://github.com/OliverHennhoefer/online-fdr
      - label: Docs
        url: https://oliverhennhoefer.github.io/online-fdr/
  - name: oddball
    description: A lightweight collection of anomaly detection datasets for reproducible experiments.
    stack: Python, datasets, benchmarks
    links:
      - label: GitHub
        url: https://github.com/OliverHennhoefer/oddball
  - name: aberrant
    description: Online anomaly detection algorithms for streaming settings.
    stack: Python, streaming, anomaly detection
    links:
      - label: GitHub
        url: https://github.com/OliverHennhoefer/aberrant

